# One-command local demo: MongoDB + API + built web client behind nginx.
# Usage:
#   docker compose up --build
#   docker compose exec api npm run seed        # or: seed:demo
#   open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/goodpanda
      # Override these in a .env file next to this compose file before exposing the app.
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DEFAULT_DELIVERY_FEE: ${DEFAULT_DELIVERY_FEE:-60}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
      # Optional integrations; leave empty to keep them disabled.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-GoodPanda <receipts@goodpanda.test>}
    volumes:
      - uploads:/app/uploads
    ports:
      - '5000:5000'

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  mongo-data:
  uploads:
